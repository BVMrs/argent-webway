[package]
name = "audit-vectors"
version = "0.1.0"
edition = "2021"
publish = false
description = "Generates and self-checks the audit/v0 conformance vectors"

[dependencies]
blake3 = "1.8"
ed25519-dalek = "2.2"
curve25519-dalek = "4.1"
base64 = "0.22"
hex = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
sha2 = "0.10"

[workspace]
