[package]
name = "mailbox-model"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reference model for the mailbox/v0 conformance vectors: generates the table-derived vectors and checks all of them"

[dependencies]
blake3 = "1.8"
ed25519-dalek = "2.2"
base64 = "0.22"
hex = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }

[workspace]
