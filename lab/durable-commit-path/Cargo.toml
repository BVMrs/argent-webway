[package]
name = "durable-commit-path"
version = "0.1.0"
edition = "2021"
publish = false
description = "Lab: cost of the durable acceptance commit (dedupe + task + audit entry + signed receipt) and of AUD-401 reject logging under a flood"

[dependencies]
redb = "4"
rusqlite = { version = "0.42", features = ["bundled"] }
fjall = "3"
crossbeam-channel = "0.5"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
rand_distr = "0.4"
hex = "0.4"

[profile.release]
debug = false

[workspace]
