[package]
name = "inline-threshold"
version = "0.1.0"
edition = "2021"
publish = false
description = "Lab: where should blob/v0 switch from inline Part bytes to a blob reference?"

[dependencies]
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_json_canonicalizer = "0.4"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
rand = "0.8"
bao-tree = "0.17"

[profile.release]
debug = false

[workspace]
