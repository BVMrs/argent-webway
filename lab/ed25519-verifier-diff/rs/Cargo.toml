[package]
name = "ed25519-verifier-diff"
version = "0.1.0"
edition = "2021"
publish = false
description = "Lab: differential test of Ed25519 verifiers against the envelope/v0 ENV-210/211 strict rule"

[dependencies]
curve25519-dalek = { version = "4.1", features = ["digest"] }
ed25519-dalek = "2.2"
ed25519-zebra = "4"
ring = "0.17"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
hex = "0.4"
serde_json = "1"
blake3 = "1"
base64 = "0.22"

[workspace]
